name: Deploy Pages
on:
  # 2026-11-21：公開は release ブランチだけ。main への push では公開しない（作業の正本と、公開の時期を分ける）。
  # 公開するとき＝ git push origin main:release （release を main の位置へ進める）
  push:
    branches: [release]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
