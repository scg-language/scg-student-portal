<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F3D3A">
<title>教室PCの遠隔検証画面 — SCG 学生ポータル</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0F3D3A;color:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}.display-header{padding:10px 18px;background:#092f2b;display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}.display-header b{font-size:16px}.display-header small{display:block;color:#bcded5;font-size:12px}.display-actions{display:flex;align-items:center;gap:12px;font-size:13px;color:#c9e9df}.display-actions button{font:inherit;min-height:40px;padding:7px 12px;border:1px solid #7aa99c;border-radius:9px;background:#173f36;color:#fff;cursor:pointer}.display-actions .error{color:#ffdda2}iframe{width:100%;height:calc(100dvh - 72px);min-height:650px;border:0;display:block}footer{font-size:12px;padding:8px 18px;color:#bcded5;background:#092f2b}@media(max-width:600px){.display-header{padding:10px 13px}.display-actions{font-size:12px}iframe{height:calc(100dvh - 100px);min-height:730px}}
</style>
</head>
<body data-demo-role="room">
<header class="display-header"><div><b>教室PC · 遠隔検証用</b><small>ログイン不要／すべて架空データ／集計だけを表示</small></div><div class="display-actions"><span id="room-connection" role="status">接続を確認中</span><button id="room-retry" type="button">接続を確認する</button></div></header>
<iframe id="remote-room-frame" title="教室への投影" referrerpolicy="no-referrer"></iframe>
<footer>先生は別のスマホでログインして操作します。通信が確認できない時は、最後の結果を出し続けず待ち受けへ戻ります。</footer>
<script>window.SCG_ROOM_DISPLAY_ONLY=true;</script>
<script src="assets/api.js"></script>
<script src="assets/teacher-demo-remote.js"></script>
</body>
</html>
