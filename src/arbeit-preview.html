<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アルバイト情報の見本 — SCG 学生ポータル</title>
<link rel="stylesheet" href="assets/arbeit-preview.css">
</head>
<body>
<header class="ap-top">
 <h1>アルバイト情報（書類の提出と確認）の見本</h1>
 <p id="ap-notice" class="ap-notice">これは見本です。ダミーのデータだけで動き、再読み込みで元に戻ります。写真はどこにも送られず、この画面の中で表示するだけです。</p>
 <nav class="ap-tabs" aria-label="見る画面">
  <button id="tab-student" type="button" aria-pressed="true">学生の画面</button>
  <button id="tab-staff" type="button" aria-pressed="false">職員の画面</button>
 </nav>
</header>

<main>
 <!-- 学生の画面（やさしい日本語） -->
 <section id="view-student" class="ap-view" aria-label="学生の画面">
  <div class="ap-picker">
   <label for="st-who">見本の操作：どの学生として見るか</label>
   <select id="st-who"></select>
  </div>
  <div class="ap-phone" id="st-phone">
   <div class="ap-card">
    <h2>あなたの アルバイト</h2>
    <div id="st-status"></div>
   </div>
   <div class="ap-card">
    <h2>だす しょるい</h2>
    <div id="st-docs"></div>
   </div>
   <div class="ap-card" id="st-submit-card">
    <h2>しょるいを だす</h2>
    <div id="st-submit-body">
     <p class="ap-step">① しゃしんを えらぶ</p>
     <input id="st-file" type="file" accept="image/*">
     <div id="st-thumb" class="ap-thumb" hidden><img id="st-thumb-img" alt="えらんだ しゃしん"></div>
     <p class="ap-step">② どの しょるいか えらぶ</p>
     <label class="ap-field">はたらく ところ<select id="st-wp"></select></label>
     <label class="ap-field">しょるい<select id="st-kind">
      <option value="payslip">きゅうよ めいさい（まいつき）</option>
      <option value="contract">こよう けいやくしょ（1かい だけ）</option>
     </select></label>
     <label class="ap-field" id="st-month-field">なんがつ ぶん<select id="st-month"></select></label>
     <p class="ap-step">③ だす</p>
     <button id="st-send" type="button" class="ap-primary">だす</button>
    </div>
    <p id="st-msg" class="ap-msg" role="status" hidden></p>
   </div>
  </div>
 </section>

 <!-- 職員の画面（ふつうの日本語） -->
 <section id="view-staff" class="ap-view" aria-label="職員の画面" hidden>
  <div class="ap-filters">
   <label class="ap-field">クラス<select id="sf-class"></select></label>
   <label class="ap-field">月<select id="sf-month"></select></label>
   <label class="ap-field">状態<select id="sf-state">
    <option value="">すべて</option>
    <option value="submitted">未確認だけ</option>
    <option value="missing">未提出だけ</option>
    <option value="returned">差し戻し中だけ</option>
   </select></label>
  </div>
  <p id="sf-summary" class="ap-summary"></p>
  <div class="ap-legend" id="sf-legend"></div>
  <div class="ap-tablewrap">
   <table class="ap-table" id="sf-table">
    <thead><tr id="sf-head"></tr></thead>
    <tbody id="sf-body"></tbody>
   </table>
  </div>
  <p id="sf-empty" class="ap-muted" hidden>条件に当てはまる学生はいません。</p>
  <section id="sf-detail" class="ap-card ap-detail" hidden aria-label="書類の詳細">
   <div class="ap-detail-head"><h2 id="dt-title"></h2><button id="dt-close" type="button">閉じる</button></div>
   <p id="dt-state"></p>
   <div id="dt-doc"></div>
   <div id="dt-actions"></div>
   <p id="dt-msg" class="ap-msg" role="status" hidden></p>
   <div id="dt-history"></div>
  </section>
 </section>
</main>
<script src="assets/arbeit-preview.js"></script>
</body>
</html>
